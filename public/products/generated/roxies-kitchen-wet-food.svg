<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 600"
  width="600"
  height="600"
>
  <rect
    width="600"
    height="600"
    rx="36"
    fill="#2563eb"
  />

  <!-- Decorative background -->
  <circle
    cx="510"
    cy="80"
    r="165"
    fill="#bfdbfe"
    opacity="0.18"
  />

  <circle
    cx="70"
    cy="555"
    r="190"
    fill="#bfdbfe"
    opacity="0.12"
  />

  <!-- Brand label -->
  <text
    x="300"
    y="58"
    text-anchor="middle"
    fill="#bfdbfe"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="4"
  >
    BRAND
  </text>

  <!-- Brand name -->
  <text
    x="300"
    y="118"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
  >
    Roxie's Kitchen
  </text>

  <!-- Product icon -->
  <g
    transform="translate(180 165) scale(10)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    
  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
  <path d="M4 8h16a1 1 0 0 1 1 1v.5c0 1.5 -2.517 5.573 -4 6.5v1a1 1 0 0 1 -1 1h-8a1 1 0 0 1 -1 -1v-1c-1.687 -1.054 -4 -5 -4 -6.5v-.5a1 1 0 0 1 1 -1" />

  </g>

  <!-- Product type label -->
  <text
    x="300"
    y="448"
    text-anchor="middle"
    fill="#bfdbfe"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="4"
  >
    PRODUCT TYPE
  </text>

  <!-- Product type -->
  <text
    x="300"
    y="505"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
