<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 600"
  width="600"
  height="600"
>
  <rect
    width="600"
    height="600"
    rx="36"
    fill="#c2410c"
  />

  <!-- Decorative background -->
  <circle
    cx="510"
    cy="80"
    r="165"
    fill="#fed7aa"
    opacity="0.18"
  />

  <circle
    cx="70"
    cy="555"
    r="190"
    fill="#fed7aa"
    opacity="0.12"
  />

  <!-- Brand label -->
  <text
    x="300"
    y="58"
    text-anchor="middle"
    fill="#fed7aa"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="4"
  >
    BRAND
  </text>

  <!-- Brand name -->
  <text
    x="300"
    y="118"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
