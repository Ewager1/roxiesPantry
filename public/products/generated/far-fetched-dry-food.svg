<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 600"
  width="600"
  height="600"
>
  <rect
    width="600"
    height="600"
    rx="36"
    fill="#0369a1"
  />

  <!-- Decorative background -->
  <circle
    cx="510"
    cy="80"
    r="165"
    fill="#bae6fd"
    opacity="0.18"
